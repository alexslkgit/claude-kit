<!doctype html>
<!-- example.plan.html — proof that the shell renders, and the shape to copy for a real plan.
     This file sits NEXT TO the shell, so it links ./plan.css and ./plan.js.
     A real plan lives at <repo>/.claude/tasks/<task>.plan.html and links _shell/plan.css
     and _shell/plan.js instead. Everything else is identical: data only, no markup. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- No auto-refresh of any kind: a page reload yanks the user's macOS Space to the browser.
     A plan is a static document; after editing it, tell the user to reload the tab. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пример разжёванного плана</title>
<link rel="stylesheet" href="./plan.css">
</head>
<body>
