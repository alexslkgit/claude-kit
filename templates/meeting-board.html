<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting</title>
<style>
  :root { color-scheme: dark; --bg:#0e0f11; --fg:#f4f4f0; --mut:#84847e; --line:#25272c;
          --pin:#ffd24a; --no:#ff6b5a; }
  * { box-sizing:border-box }
  html,body { max-width:100%; overflow-x:hidden }
  body { margin:0; padding:1.1rem 1rem 3rem; background:var(--bg); color:var(--fg);
         font:20px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
  .wrap { max-width:40rem; margin:0 auto }

  .now { font-size:1.45rem; font-weight:800; line-height:1.25; margin:0 0 1.1rem }
  .now.quiet { color:var(--mut); font-weight:600 }

  h2 { font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mut);
       margin:1.4rem 0 .5rem; font-weight:800 }

  ul.facts { list-style:none; margin:0; padding:0 }
  ul.facts li { display:flex; align-items:baseline; gap:.6rem; padding:.5rem 0;
                border-bottom:1px solid var(--line); font-size:1.5rem; font-weight:700;
                line-height:1.2 }
  ul.facts li:last-child { border-bottom:0 }
  .src { margin-left:auto; flex:0 0 auto; font-size:.8rem; font-weight:700; color:var(--mut);
         text-transform:uppercase; letter-spacing:.06em; white-space:nowrap }

  ul.no { list-style:none; margin:0; padding:0 }
  ul.no li { padding:.4rem 0; font-size:1.15rem; color:var(--no); font-weight:600 }

  .say { background:var(--pin); color:#141414; border-radius:14px; padding:1rem 1.15rem;
         font-size:1.35rem; line-height:1.3; font-weight:800; margin:.4rem 0 0 }

  ol.log { list-style:none; margin:0; padding:0; border-top:1px solid var(--line) }
  ol.log li { display:flex; gap:.8rem; padding:.45rem 0; border-bottom:1px solid var(--line);
              font-size:1rem; color:var(--mut) }
  ol.log li .t { font-variant-numeric:tabular-nums; flex:0 0 3rem }
  ol.log li.mine { color:var(--pin); font-weight:700 }

  .upd { color:var(--mut); font-size:.8rem; margin-top:1.3rem; text-align:right }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script id="board-data" type="application/json">
{"meeting":"Meeting","refresh":120,"now":"Пока ничего.","facts":[],"dont":[],"entries":[],"updated":""}
</script>

<script>
  const D = JSON.parse(document.getElementById("board-data").textContent);
  const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const out = [];

  document.title = D.meeting || "Meeting";
  if (D.refresh) setTimeout(() => location.reload(), Math.max(5, +D.refresh) * 1000);

  const now = D.now || "Тебя не касается.";
  out.push(`<p class="now${D.facts && D.facts.length ? "" : " quiet"}">${esc(now)}</p>`);

  if (D.facts && D.facts.length) {
    out.push("<h2>факты</h2><ul class=\"facts\">");
    for (const f of D.facts) {
      out.push(`<li><span>${esc(f.text)}</span><span class="src">${esc(f.src || "")}</span></li>`);
    }
    out.push("</ul>");
  }

  if (D.dont && D.dont.length) {
    out.push("<h2>не говори</h2><ul class=\"no\">");
    for (const d of D.dont) out.push(`<li>${esc(d)}</li>`);
    out.push("</ul>");
  }

  if (D.say) {
    out.push("<h2>фраза, ты просил</h2>");
    out.push(`<div class="say">${esc(D.say)}</div>`);
  }

  if (D.entries && D.entries.length) {
    out.push("<h2>как шло</h2><ol class=\"log\">");
    for (const e of D.entries) {
      out.push(`<li class="${e.mine ? "mine" : ""}"><span class="t">${esc(e.t || "")}</span>`
             + `<span>${esc(e.text || "")}</span></li>`);
    }
    out.push("</ol>");
  }

  if (D.updated) out.push(`<div class="upd">${esc(D.updated)}</div>`);

  document.getElementById("root").innerHTML = out.join("");
</script>
</body>
</html>
